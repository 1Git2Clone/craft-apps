<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111b25">
<title>Crafts</title>
<!--
  The crafts.<domain> shell: a bar with an app switcher and the pinned version,
  and the chosen app in an iframe. Each app is the upstream web build unpacked
  next to this file as <name>/, so the frame is same-origin. The route is the
  hash (#photocraft) because the paths /<name>/ are the apps themselves.
  versions.json is written by the workflow from its SITES list.
-->
<style>
  :root { --bg: #111b25; --panel: #162231; --line: #24344a; --text: #e6edf5; --dim: #8fa1b5; --accent: #3b8cff; --ok: #3ccf8e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-bottom: 1px solid var(--line); flex: none; }
  .brand { font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
  .sep { width: 1px; height: 18px; background: var(--line); }
  button, a { color: inherit; font: inherit; }
  .switch { display: flex; align-items: center; gap: 6px; background: none; border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  .switch:hover, .switch:focus-visible { border-color: var(--line); background: var(--panel); }
  .badge { color: var(--ok); font-size: 12px; text-decoration: none; white-space: nowrap; }
  .badge::before { content: "● "; font-size: 9px; vertical-align: 1px; }
  .badge:hover { text-decoration: underline; }
  .spacer { flex: 1; }
  .icon-btn { background: none; border: 0; padding: 4px; cursor: pointer; color: var(--dim); text-decoration: none; display: flex; }
  .icon-btn:hover { color: var(--text); }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  iframe { flex: 1; width: 100%; border: 0; background: #1e1e1e; }

  #menu { position: fixed; inset: 44px auto auto 12px; margin: 0; width: min(300px, calc(100vw - 24px)); max-height: calc(100vh - 56px); overflow: auto;
          padding: 8px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px #0008; }
  #menu h2 { margin: 6px 10px 8px; font-size: 10px; font-weight: 600; letter-spacing: .12em; color: var(--dim); text-transform: uppercase; }
  #menu a { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 8px; text-decoration: none; }
  #menu a:hover, #menu a:focus-visible { background: #1d2c3f; outline: none; }
  #menu a[aria-current] { background: #1f3550; }
  #menu a[aria-current]::after { content: "✓"; margin-left: auto; color: var(--accent); }
  #menu .ic { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 7px; color: var(--c); }
  #menu small { display: block; color: var(--dim); font-size: 11px; }
  #menu p { margin: 8px 10px 4px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11px; }

  @media (max-width: 480px) { .brand, .sep { display: none; } }
</style>
</head>
<body>
<header>
  <span class="brand">Crafts</span>
  <span class="sep"></span>
  <button class="switch" popovertarget="menu" aria-haspopup="true">
    <span id="current">…</span>
    <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <a class="badge" id="version" target="_blank" rel="noopener" hidden></a>
  <span class="spacer"></span>
  <a class="icon-btn" id="source" target="_blank" rel="noopener" title="Source">
    <svg viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>
  </a>
  <button class="icon-btn" id="fullscreen" title="Fullscreen">
    <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
  </button>
</header>

<div id="menu" popover>
  <h2>Apps</h2>
  <nav id="apps"></nav>
  <p>Free to use. No account needed.</p>
</div>

<iframe id="frame" title="App" allow="fullscreen; clipboard-read; clipboard-write; autoplay; microphone"></iframe>

<script type="module">
  // [id, name, what it is, icon colour, icon path]
  const apps = [
    ["photocraft", "PhotoCraft", "Image editing", "#4ab3ff", '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>'],
    ["filmcraft", "FilmCraft", "Video editing", "#9b8cff", '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m10 9 5 3-5 3z"/>'],
    ["effectcraft", "EffectCraft", "Motion graphics & VFX", "#3ccf8e", '<path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/>'],
    ["figcraft", "FigCraft", "Interface design", "#ff8a65", '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>'],
    ["wordcraft", "WordCraft", "Documents & word processing", "#5c9dff", '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>'],
    ["gridcraft", "GridCraft", "Spreadsheets", "#3ccf8e", '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>'],
    ["deckcraft", "DeckCraft", "Presentations & slides", "#ffb74d", '<rect x="2" y="3" width="20" height="13" rx="2"/><path d="M12 16v5M8 21h8"/>'],
    ["cadcraft", "CADCraft", "CAD & drafting", "#ffd54f", '<path d="M4 20V4l16 16z"/><path d="M8 16v-4l4 4z"/>'],
  ];
  const svg = (path) => `<svg viewBox="0 0 24 24">${path}</svg>`;
  const $ = (id) => document.getElementById(id);

  $("apps").innerHTML = apps.map(([id, name, what, colour, path]) =>
    `<a href="#${id}" style="--c:${colour}"><span class="ic">${svg(path)}</span><span>${name}<small>${what}</small></span></a>`).join("");
  $("apps").addEventListener("click", () => $("menu").hidePopover());
  $("fullscreen").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();

  // Missing or broken versions.json only costs the badge.
  const versions = await fetch("versions.json").then((r) => r.json()).catch(() => ({}));

  function show() {
    const [id, name] = apps.find(([id]) => id === location.hash.slice(1)) ?? apps[0];
    if ($("frame").dataset.app !== id) {
      $("frame").dataset.app = id;
      $("frame").src = `${id}/`;
    }
    $("frame").title = `${name} editor`;
    document.title = `${name} · Crafts`;
    $("current").textContent = name;
    $("source").href = `https://git.hu-tao.dev/craft-projects/${id}`;
    for (const a of $("apps").children) a.toggleAttribute("aria-current", a.hash === `#${id}`);

    const v = versions[id];
    $("version").hidden = !v;
    if (v) {
      $("version").textContent = `v${v} · pinned`;
      $("version").title = "The release published here. Renovate opens a pull request for each new one.";
      $("version").href = `https://github.com/storytold/${id}/releases/tag/v${v}`;
    }
  }
  addEventListener("hashchange", show);
  show();
</script>
</body>
</html>
