# Publishes the site to GitHub Pages. Forgejo reads .forgejo/workflows instead
# and never runs this one.
#
# One-time setup in a fork: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". Then push to main, or run this workflow by hand.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches package.json's engines.
          node-version: 26

      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile

      # Each app's upstream release, checked against its SHA256SUMS.txt. The
      # versions are pinned in sites.json.
      - run: pnpm fetch-apps

      # A project site is served under /<repo>, a user or organisation site
      # (<name>.github.io) at the root. configure-pages knows which this is.
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
