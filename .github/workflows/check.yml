# The checks on every branch and pull request. main is left out: its Pages
# workflow runs the same checks before it deploys.
name: Check

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches package.json's engines.
          node-version: 26
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile

      # Fastest first: a formatting slip fails in a second, before the
      # language servers spend fifteen starting up.
      - run: pnpm check:format
      - run: pnpm check:lint
      - run: pnpm check:types
      - run: pnpm check:lsp
