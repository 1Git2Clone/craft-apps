# The checks on every branch and pull request. main is left out: its Pages
# workflow runs the same checks before it publishes.
name: Check

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      # Matches package.json's engines and the flake's dev shell.
      image: node:26-bookworm
    steps:
      # Podman refuses to unpack actions through Debian's /var/run -> /run
      # symlink; see the same step in the compress repo's pages workflow.
      - run: rm /var/run && cp -a /run /var/run
      - uses: actions/checkout@v4
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile

      # Fastest first: a formatting slip fails in a second, before the
      # language servers spend fifteen starting up.
      - run: pnpm check:format
      - run: pnpm check:lint
      - run: pnpm check:types
      - run: pnpm check:lsp
