name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pages:
    runs-on: ubuntu-latest
    container:
      # Matches package.json's engines and the flake's dev shell.
      image: node:26-bookworm
    steps:
      # Podman refuses to unpack actions through Debian's /var/run -> /run
      # symlink; see the same step in the compress repo's pages workflow.
      - run: rm /var/run && cp -a /run /var/run
      - uses: actions/checkout@v4

      # Node 26 no longer ships corepack, so pnpm is installed at the version
      # package.json names.
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile

      # Upstream already publishes each browser build as a static site, so
      # take the releases instead of building the wasm on the runner. The
      # versions are pinned in sites.json.
      - run: pnpm fetch-apps

      # The shell: one prerendered page per app, with the apps under /apps/.
      - run: pnpm build

      # The VPS fetches the newest artifact named exactly `pages` and unpacks
      # it to <pages volume>/craft-projects/pages; see the compress repo's
      # workflow for why this is forgejo/upload-artifact and not actions/.
      - name: Publish
        uses: forgejo/upload-artifact@v5
        with:
          name: pages
          path: build/
          if-no-files-found: error
