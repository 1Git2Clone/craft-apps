name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pages:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    env:
      # <repo>:<version> for each upstream storytold release published here.
      # Bump a version to publish a newer release; add a line for a new site
      # (and its name on the VPS: see docs/src/operations/pages.md there).
      SITES: |
        photocraft:0.9.0
        cadcraft:0.7.0
        effectcraft:0.10.0
        filmcraft:0.8.0
        figcraft:0.6.0
        gridcraft:0.7.0
        deckcraft:0.7.0
        wordcraft:0.7.0
    steps:
      # Podman refuses to unpack actions through Debian's /var/run -> /run
      # symlink; see the same step in the compress repo's pages workflow.
      - run: rm /var/run && cp -a /run /var/run
      - uses: actions/checkout@v4

      # Upstream already publishes each browser build as a static site, so
      # take the release instead of building the wasm on the runner. Each is
      # checked against its release's SHA256SUMS.txt and unpacked to <repo>/,
      # which the VPS serves as <repo>.hu-tao.dev.
      - name: Fetch the releases
        run: |
          set -eu
          mkdir out
          for s in $SITES; do
            repo=${s%%:*} version=${s#*:}
            base=https://github.com/storytold/$repo/releases/download/v$version
            mkdir "dl-$repo" && cd "dl-$repo"
            curl -fsSLO "$base/$repo-web-$version.zip"
            curl -fsSLO "$base/SHA256SUMS.txt"
            grep -q " \*\?$repo-web-$version.zip\$" SHA256SUMS.txt
            sha256sum -c --ignore-missing SHA256SUMS.txt
            unzip -q "$repo-web-$version.zip"
            mv "$repo-web-$version" "../out/$repo"
            cd ..
          done

      # The crafts.hu-tao.dev shell sits at the root, beside the apps, and
      # reads each app's version from versions.json.
      - name: Add the shell
        run: |
          cp index.html out/
          echo "$SITES" | awk -F: 'NF == 2 { printf "%s\"%s\":\"%s\"", n++ ? "," : "{", $1, $2 } END { print "}" }' > out/versions.json
          cat out/versions.json

      # The VPS fetches the newest artifact named exactly `pages` and unpacks
      # it to <pages volume>/craft-projects/pages; see the compress repo's
      # workflow for why this is forgejo/upload-artifact and not actions/.
      - name: Publish
        uses: forgejo/upload-artifact@v5
        with:
          name: pages
          path: out/
          if-no-files-found: error
